# Removed from bootstrap as it it does not work.
# one or more objects failed to apply, reason: Application.argoproj.io "showroom-addon" is invalid: [spec.destination: Required value, spec.project: Required value]
{{ if .Values.showroom -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showroom-apps
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: {{ .Values.git.url }}
    targetRevision: {{ .Values.showroom.addons.repoRef }}
    path: {{ .Values.showroom.addons.repoPath }}
    helm:
      values: |
        user:
          count: "{{ .Values.user.count }}"
        deployer:
          domain: {{ .Values.deployer.domain }}
        content:
          repoUrl: {{ .Values.showroom.content.repoUrl }}
          repoRef: {{ .Values.showroom.content.repoRef }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-gitops
{{- end }}
